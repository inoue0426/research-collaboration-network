<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Research Collaboration Network</title><script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script><style>body{margin:0;background:#0b1220;color:#e5e7eb;font:14px system-ui}header{padding:18px 22px;border-bottom:1px solid #334155}h1{margin:0;font-size:23px}p,.muted{color:#94a3b8}main{display:grid;grid-template-columns:390px 1fr;height:calc(100vh - 118px)}aside{padding:16px;overflow:auto;border-right:1px solid #334155}input,select,button{box-sizing:border-box;width:100%;padding:10px;margin:6px 0;background:#1e293b;color:white;border:1px solid #475569;border-radius:7px}button{background:#2563eb;cursor:pointer;border:0}button:disabled{opacity:.5}.person{padding:12px 5px;border-bottom:1px solid #334155;cursor:pointer}.person:hover{background:#1e293b}.small{font-size:12px;color:#94a3b8}a{color:#93c5fd}#graph{width:100%;height:100%;touch-action:pan-y}.cluster-label{font-weight:700;pointer-events:none}.cluster-count{font-size:11px;fill:#94a3b8;pointer-events:none}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}.error{color:#fca5a5}.chip{font-size:11px;border:1px solid #475569;padding:2px 5px;border-radius:5px}@media(max-width:800px){main{display:block;height:auto}aside{max-height:none}#graph{height:60vh}}</style></head><body><header><h1>Research Collaboration Network</h1><p>Explore coauthorship and institutional connections</p></header><main><aside><button id="load">Load combined network</button><div id="status" class="small">Load public OpenAlex records to begin.</div><div class="controls"><div><label>Institution</label><select id="institution"><option value="all">All</option><option value="boston">Boston / Cambridge</option><option value="bay">Bay Area</option><option value="broad">Broad</option><option value="dfci">Dana-Farber</option><option value="harvard">Harvard</option><option value="mit">MIT</option><option value="stanford">Stanford</option></select></div><div><label>Connection</label><select id="depth"><option value="all">All paths</option><option value="1">Direct only</option><option value="2">2-hop only</option></select></div></div><div class="controls"><div><label>Graph layout</label><select id="layout"><option value="cluster">Institution clusters</option><option value="network">Collaboration network</option></select></div><div><label>Graph size</label><select id="limit"><option value="25">Top 25</option><option value="50" selected>Top 50</option><option value="100">Top 100</option></select></div></div><input id="filter" placeholder="Search researcher or institution"><div id="legend" class="small"></div><label>Minimum direct shared papers: <span id="minLabel">1</span></label><input id="min" type="range" min="1" max="8" value="1"><div class="small">Ranking is a heuristic, not a verified personal relationship. Institutions are OpenAlex last-known affiliations, not confirmed current positions or PI status.</div><div id="people"></div></aside><svg id="graph"></svg></main><script src="app.js?v=20261009-fix2"></script></body></html>
