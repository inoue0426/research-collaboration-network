<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Research Collaboration Network</title><script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script><style>body{margin:0;background:#0b1220;color:#e5e7eb;font:14px system-ui}header{padding:18px 24px;border-bottom:1px solid #334155}h1{margin:0;font-size:22px}p{color:#94a3b8}main{display:grid;grid-template-columns:310px 1fr;height:calc(100vh - 100px)}aside{padding:18px;overflow:auto;border-right:1px solid #334155}input,select,button{box-sizing:border-box;width:100%;padding:10px;margin:6px 0;background:#1e293b;color:white;border:1px solid #475569;border-radius:7px}button{cursor:pointer;background:#2563eb;border:0}#graph{width:100%;height:100%}.person{padding:10px;border-bottom:1px solid #334155;cursor:pointer}.person:hover{background:#1e293b}a{color:#93c5fd}.muted{color:#94a3b8;font-size:12px}.error{color:#fca5a5}@media(max-width:700px){main{display:block;height:auto}aside{max-height:400px}#graph{height:65vh}}</style></head><body><header><h1>Research Collaboration Network</h1><p>Explore verified coauthorship evidence via OpenAlex. Coauthorship does not establish a personal relationship or willingness to introduce.</p></header><main><aside><label>Seed researcher</label><select id="seed"><option value="Augustin Luna">Augustin Luna</option><option value="Rui Kuang">Rui Kuang</option></select><button id="load">Load collaborators</button><input id="filter" placeholder="Filter name or institution"><label>Minimum shared papers <span id="count">1</span></label><input id="min" type="range" min="1" max="10" value="1"><div id="status" class="muted">Select a researcher to begin.</div><div id="people"></div></aside><svg id="graph"></svg></main><script src="app.js"></script></body></html>
